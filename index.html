<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonder Runner</title>
<style>
  :root { --ember: #ff5a1f; --bg: #060403; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: ui-monospace, Menlo, Consolas, monospace; color: #ffd9c4; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  .hud { position: fixed; top: 14px; left: 18px; right: 18px; display: flex; justify-content: space-between; pointer-events: none; letter-spacing: .12em; font-size: 14px; text-shadow: 0 0 12px var(--ember); }
  .panel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(6,4,3,.55); backdrop-filter: blur(2px); transition: opacity .3s; }
  .panel.hide { opacity: 0; pointer-events: none; }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 56px); letter-spacing: .3em; color: var(--ember); text-shadow: 0 0 30px var(--ember); }
  p { margin: 6px 0; opacity: .85; }
  button { margin-top: 18px; padding: 12px 28px; font: inherit; font-size: 16px; letter-spacing: .2em; color: #fff; background: transparent; border: 1px solid var(--ember); border-radius: 999px; cursor: pointer; box-shadow: 0 0 18px rgba(255,90,31,.5); }
  button:hover { background: var(--ember); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
<div class="panel" id="panel">
  <h1 id="title">SONDER RUNNER</h1>
  <p id="msg">Move your mouse to steer the rocket. Dodge the shadows. Click to boost.</p>
  <button id="go">PLAY</button>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const bg = new Image();
  bg.src = encodeURI('ChatGPT Image Jul 22, 2026, 05_42_50 PM.png');
  let W, H, dpr;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  let best = 0;
  try { best = +localStorage.getItem('sonderBest') || 0; } catch (e) {}
  $('best').textContent = best;

  const mouse = { x: 0, y: 0 };
  function setPos(x, y) { mouse.x = x; mouse.y = y; }
  addEventListener('mousemove', e => setPos(e.clientX, e.clientY));
  addEventListener('touchmove', e => { setPos(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, { passive: false });

  let state = 'menu', ship, rocks, sparks, score, t, speed, boost, boostCd, scroll;

  function reset() {
    ship = { x: W * 0.22, y: H / 2, vy: 0 };
    rocks = []; sparks = []; score = 0; t = 0; speed = 5; boost = 0; boostCd = 0; scroll = 0;
    setPos(ship.x, ship.y);
  }
  function start() { reset(); state = 'play'; $('panel').classList.add('hide'); }
  function end() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('sonderBest', best); } catch (e) {} $('best').textContent = best; }
    $('title').textContent = 'GAME OVER';
    $('msg').textContent = 'You scored ' + score + (score >= best && score > 0 ? '  ·  new best!' : '') + '. Everyone is moving. Try again.';
    $('go').textContent = 'PLAY AGAIN';
    $('panel').classList.remove('hide');
    for (let i = 0; i < 60; i++) burst(ship.x, ship.y, 1);
  }
  $('go').addEventListener('click', e => { e.stopPropagation(); start(); });
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { state === 'play' ? doBoost() : start(); e.preventDefault(); } });
  addEventListener('mousedown', () => { if (state === 'play') doBoost(); });
  addEventListener('touchstart', () => { if (state === 'play') doBoost(); });

  function doBoost() { if (boostCd <= 0) { boost = 30; boostCd = 90; } }
  function burst(x, y, n) {
    for (let i = 0; i < n; i++) sparks.push({ x, y, vx: (Math.random() - .5) * 6, vy: (Math.random() - .5) * 6, life: 30 + Math.random() * 30 });
  }

  function spawn() {
    const r = 18 + Math.random() * 38;
    rocks.push({ x: W + r, y: r + Math.random() * (H - 2 * r), r, vx: speed + Math.random() * 3, wob: Math.random() * 6 });
  }

  function update() {
    t++;
    speed = 5 + Math.min(t / 600, 8);
    scroll += speed * 0.4;
    if (t % Math.max(14, 46 - Math.floor(t / 120)) === 0) spawn();
    // rocket eases toward mouse
    const lag = boost > 0 ? 0.35 : 0.14;
    const ty = Math.max(30, Math.min(H - 30, mouse.y));
    ship.vy = (ty - ship.y) * lag;
    ship.y += ship.vy;
    ship.x += (Math.max(40, Math.min(W * 0.6, mouse.x)) - ship.x) * lag * 0.7;
    if (boost > 0) boost--;
    if (boostCd > 0) boostCd--;
    burst(ship.x - 22, ship.y, 1);
    for (const r of rocks) { r.x -= r.vx * (boost > 0 ? 0.6 : 1); r.wob += 0.05; r.y += Math.sin(r.wob) * 0.8; }
    rocks = rocks.filter(r => r.x > -80);
    sparks.forEach(s => { s.x += s.vx - 2; s.y += s.vy; s.life--; });
    sparks = sparks.filter(s => s.life > 0);
    if (t % 6 === 0) { score++; $('score').textContent = score; }
    for (const r of rocks) {
      if (boost > 0) continue; // boosting makes you ghostly
      const dx = r.x - ship.x, dy = r.y - ship.y;
      if (Math.hypot(dx, dy) < r.r * 0.8 + 12) return end();
    }
  }

  function drawBg() {
    ctx.fillStyle = '#060403'; ctx.fillRect(0, 0, W, H);
    if (bg.complete && bg.naturalWidth) {
      const s = Math.max(W / bg.naturalWidth, H / bg.naturalHeight) * 1.25;
      const w = bg.naturalWidth * s, h = bg.naturalHeight * s;
      const off = -(scroll * 0.5) % w;
      ctx.globalAlpha = 0.5;
      for (let x = off; x < W; x += w) ctx.drawImage(bg, x, (H - h) / 2, w, h);
      ctx.globalAlpha = 1;
    }
    const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H);
    g.addColorStop(0, 'rgba(6,4,3,0)'); g.addColorStop(1, 'rgba(6,4,3,.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawShip() {
    ctx.save(); ctx.translate(ship.x, ship.y);
    ctx.rotate(Math.max(-0.5, Math.min(0.5, ship.vy * 0.04)));
    ctx.shadowColor = '#ff5a1f'; ctx.shadowBlur = boost > 0 ? 40 : 20;
    ctx.globalAlpha = boost > 0 ? 0.6 : 1;
    // flame
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.moveTo(-14, -6); ctx.lineTo(-34 - Math.random() * 10, 0); ctx.lineTo(-14, 6); ctx.fill();
    // body
    ctx.fillStyle = '#ffe9dc';
    ctx.beginPath(); ctx.moveTo(24, 0); ctx.lineTo(-6, -11); ctx.lineTo(-16, -11); ctx.lineTo(-16, 11); ctx.lineTo(-6, 11); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff5a1f';
    ctx.beginPath(); ctx.moveTo(-6, -11); ctx.lineTo(-18, -22); ctx.lineTo(-18, -8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 11); ctx.lineTo(-18, 22); ctx.lineTo(-18, 8); ctx.fill();
    ctx.beginPath(); ctx.arc(4, 0, 4, 0, 7); ctx.fillStyle = '#220e06'; ctx.fill();
    ctx.restore();
  }

  function draw() {
    drawBg();
    for (const s of sparks) { ctx.globalAlpha = s.life / 60; ctx.fillStyle = '#ff7a3d'; ctx.fillRect(s.x, s.y, 3, 3); }
    ctx.globalAlpha = 1;
    for (const r of rocks) {
      const g = ctx.createRadialGradient(r.x, r.y, r.r * 0.1, r.x, r.y, r.r);
      g.addColorStop(0, 'rgba(255,120,50,.95)'); g.addColorStop(1, 'rgba(120,20,0,.15)');
      ctx.fillStyle = g; ctx.shadowColor = '#ff3d00'; ctx.shadowBlur = 25;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r * 1.5, r.r, 0, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;
    if (state === 'play') drawShip();
    // boost cooldown bar
    if (state === 'play') {
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(18, H - 22, 120, 4);
      ctx.fillStyle = '#ff5a1f'; ctx.fillRect(18, H - 22, 120 * (1 - boostCd / 90), 4);
    }
    // custom cursor
    ctx.strokeStyle = 'rgba(255,170,120,.7)'; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 8, 0, 7); ctx.stroke();
  }

  function loop() {
    if (state === 'play') update();
    else { scroll += 1; sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.life--; }); sparks = sparks.filter(s => s.life > 0); }
    draw(); requestAnimationFrame(loop);
  }
  reset(); state = 'menu'; loop();
})();
</script>
</body>
</html>
