<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sonder — Clear the bottleneck</title>
<style>
  :root {
    --ember: #ff6a2b;
    --text: #f5f5f7;
    --muted: rgba(245,245,247,.56);
    --ease: cubic-bezier(.22,.8,.2,1);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text); font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: none; }

  .hud { position: fixed; top: max(22px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; pointer-events: none; opacity: 0; transform: translateY(-6px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .hud.on { opacity: 1; transform: none; }
  .pill { padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); font-size: 13px; font-weight: 500; letter-spacing: .01em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill b { color: var(--text); font-weight: 600; margin-left: 6px; }

  .phase { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); width: 148px; height: 3px; margin-left: -74px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; opacity: 0; transition: opacity .5s var(--ease); pointer-events: none; }
  .phase.on { opacity: 1; }
  .phase i { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, #ffb085, var(--ember)); will-change: transform; }

  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; transition: opacity .6s var(--ease), visibility .6s; }
  .screen.off { opacity: 0; visibility: hidden; pointer-events: none; }
  .card { text-align: center; max-width: 560px; transform: translateY(0) scale(1); transition: transform .8s var(--ease); }
  .screen.off .card { transform: translateY(14px) scale(.985); }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--ember); margin-bottom: 18px; }
  h1 { margin: 0; font-size: clamp(40px, 8vw, 80px); line-height: 1.02; font-weight: 700; letter-spacing: -.035em; background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,.62)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin: 18px auto 0; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.45; color: var(--muted); max-width: 420px; font-weight: 400; }
  .score-big { font-size: clamp(72px, 16vw, 140px); font-weight: 700; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; background: linear-gradient(180deg, #fff 20%, rgba(255,140,80,.85)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .btn { margin-top: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border: 0; border-radius: 999px; background: var(--text); color: #000; font: 600 16px var(--font); letter-spacing: -.01em; cursor: pointer; transition: transform .35s var(--ease), box-shadow .35s var(--ease), background .35s; box-shadow: 0 0 0 0 rgba(255,106,43,0); }
  .btn:hover { transform: scale(1.04); box-shadow: 0 10px 40px -8px rgba(255,106,43,.55); }
  .btn:active { transform: scale(.97); }
  .link { display: block; margin-top: 22px; font-size: 14px; color: var(--muted); text-decoration: none; transition: color .3s; }
  .link:hover { color: var(--text); }
  .hint { margin-top: 26px; font-size: 13px; color: rgba(245,245,247,.38); letter-spacing: .02em; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <div class="pill">Score<b id="score">0</b></div>
  <div class="pill">Best<b id="best">0</b></div>
</div>
<div class="phase" id="phase"><i id="phaseFill"></i></div>

<div class="screen" id="menu">
  <div class="card">
    <div class="eyebrow">Sonder</div>
    <h1>Clear the<br>bottleneck.</h1>
    <p class="sub">Every business has one. Steer with your mouse, click to phase through.</p>
    <button class="btn" id="play">Play</button>
    <div class="hint">Move to steer &nbsp;·&nbsp; Click or Space to phase</div>
  </div>
</div>

<div class="screen off" id="over">
  <div class="card">
    <div class="eyebrow" id="overTag">Bottleneck hit</div>
    <div class="score-big" id="finalScore">0</div>
    <p class="sub" id="overMsg">Bring us the hard constraint.</p>
    <button class="btn" id="again">Play again</button>
    <a class="link" href="https://www.sonderai.agency/" target="_blank" rel="noopener">Explore Sonder AI&nbsp;→</a>
  </div>
</div>

<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  const $ = id => document.getElementById(id);
  const el = { hud: $('hud'), score: $('score'), best: $('best'), phase: $('phase'), phaseFill: $('phaseFill'),
               menu: $('menu'), over: $('over'), finalScore: $('finalScore'), overTag: $('overTag'), overMsg: $('overMsg') };

  const MSGS = ['Bring us the hard constraint.', 'We love hard problems.', 'Every business has a bottleneck.', 'Where AI meets execution.'];

  let W = 0, H = 0, dpr = 1;
  const bgSrc = new Image();
  let bgCanvas = null, bgW = 0;
  bgSrc.src = 'ChatGPT%20Image%20Jul%2022%2C%202026%2C%2005_42_50%20PM.png';
  bgSrc.onload = buildBg;

  // ---------- pre-rendered sprites (no per-frame blur) ----------
  function makeGlow(size, stops) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2;
    const gr = g.createRadialGradient(r, r, 0, r, r, r);
    stops.forEach(([o, col]) => gr.addColorStop(o, col));
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
    return c;
  }
  const sprOrb   = makeGlow(128, [[0, 'rgba(255,190,150,.95)'], [.25, 'rgba(255,106,43,.75)'], [.6, 'rgba(190,40,0,.28)'], [1, 'rgba(120,10,0,0)']]);
  const sprSpark = makeGlow(32,  [[0, 'rgba(255,200,160,1)'], [.4, 'rgba(255,106,43,.6)'], [1, 'rgba(255,60,0,0)']]);
  const sprHalo  = makeGlow(160, [[0, 'rgba(255,140,80,.35)'], [1, 'rgba(255,106,43,0)']]);

  function buildBg() {
    if (!bgSrc.naturalWidth || !W) return;
    const s = (H * 1.15) / bgSrc.naturalHeight;
    const w = Math.ceil(bgSrc.naturalWidth * s), h = Math.ceil(H * 1.15);
    const c = document.createElement('canvas'); c.width = w * dpr; c.height = H * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    g.globalAlpha = .42; g.drawImage(bgSrc, 0, (H - h) / 2, w, h); g.globalAlpha = 1;
    // seamless edge: fade the seam so the tile loops cleanly
    const fade = Math.min(180, w * .15);
    g.globalCompositeOperation = 'destination-out';
    let gr = g.createLinearGradient(0, 0, fade, 0); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, fade, H);
    gr = g.createLinearGradient(w - fade, 0, w, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
    g.fillStyle = gr; g.fillRect(w - fade, 0, fade, H);
    bgCanvas = c; bgW = w;
  }

  // vignette pre-rendered
  let vig = null;
  function buildVig() {
    vig = document.createElement('canvas'); vig.width = W * dpr; vig.height = H * dpr;
    const g = vig.getContext('2d'); g.scale(dpr, dpr);
    const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.9)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }

  // distant stars (parallax layer)
  let stars = [];
  function buildStars() {
    stars = Array.from({ length: Math.round(W * H / 14000) }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .2 + Math.random() * .8 }));
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildBg(); buildVig(); buildStars();
  }
  addEventListener('resize', resize); resize();

  // ---------- state ----------
  let best = 0;
  try { best = +localStorage.getItem('sonderBest') || 0; } catch (e) {}
  el.best.textContent = best;

  const mouse = { x: innerWidth * .3, y: innerHeight / 2 };
  const ship = { x: 0, y: 0, vy: 0, tilt: 0 };
  let mode = 'menu';          // menu | play | over
  let orbs = [], sparks = [];
  let dist = 0, speed = 0, spawnT = 0, phase = 0, cooldown = 0, scroll = 0, shake = 0;
  const PHASE_DUR = .55, PHASE_CD = 1.8;

  function setPointer(x, y) { mouse.x = x; mouse.y = y; }
  addEventListener('pointermove', e => setPointer(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerdown', e => { setPointer(e.clientX, e.clientY); if (mode === 'play') doPhase(); }, { passive: true });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (mode === 'play') doPhase(); else if (!e.repeat) start();
    }
  });
  $('play').addEventListener('click', e => { e.stopPropagation(); start(); });
  $('again').addEventListener('click', e => { e.stopPropagation(); start(); });

  function doPhase() { if (cooldown <= 0) { phase = PHASE_DUR; cooldown = PHASE_CD; } }

  function start() {
    orbs.length = 0; sparks.length = 0;
    dist = 0; speed = 330; spawnT = .6; phase = 0; cooldown = 0; shake = 0;
    ship.x = W * .22; ship.y = H / 2; ship.vy = 0; ship.tilt = 0;
    mouse.x = ship.x; mouse.y = ship.y;
    mode = 'play';
    el.menu.classList.add('off'); el.over.classList.add('off');
    el.hud.classList.add('on'); el.phase.classList.add('on');
    el.score.textContent = '0';
  }

  function crash() {
    mode = 'over';
    const s = Math.floor(dist / 10);
    const isBest = s > best;
    if (isBest) { best = s; try { localStorage.setItem('sonderBest', best); } catch (e) {} el.best.textContent = best; }
    el.finalScore.textContent = s;
    el.overTag.textContent = isBest && s > 0 ? 'New best' : 'Bottleneck hit';
    el.overMsg.textContent = MSGS[(Math.random() * MSGS.length) | 0];
    for (let i = 0; i < 46; i++) emit(ship.x, ship.y, 1);
    shake = .35;
    el.hud.classList.remove('on'); el.phase.classList.remove('on');
    setTimeout(() => el.over.classList.remove('off'), 380);
  }

  function emit(x, y, burst) {
    const a = Math.random() * 6.283, v = burst ? 60 + Math.random() * 360 : 20 + Math.random() * 40;
    sparks.push({ x, y, vx: burst ? Math.cos(a) * v : -v - speed * .25, vy: burst ? Math.sin(a) * v : (Math.random() - .5) * 40, life: 0, max: burst ? .6 + Math.random() * .6 : .35 + Math.random() * .25, s: burst ? .5 + Math.random() * .6 : .35 + Math.random() * .3 });
  }

  function spawnOrb() {
    const r = 20 + Math.random() * 34;
    orbs.push({ x: W + r * 2, y: r + 70 + Math.random() * (H - r * 2 - 140), r, vx: speed * (.95 + Math.random() * .25), ph: Math.random() * 6.283, amp: 10 + Math.random() * 26 });
  }

  // ---------- update (dt in seconds) ----------
  function update(dt) {
    if (mode === 'play') {
      speed = 330 + Math.min(dist / 90, 420);
      dist += speed * dt;
      scroll += speed * dt;
      el.score.textContent = Math.floor(dist / 10);

      // frame-rate independent critically-damped follow
      const k = 1 - Math.exp(-(phase > 0 ? 22 : 11) * dt);
      const ty = Math.max(36, Math.min(H - 36, mouse.y));
      const tx = Math.max(60, Math.min(W * .55, mouse.x));
      const py = ship.y;
      ship.y += (ty - ship.y) * k;
      ship.x += (tx - ship.x) * k * .7;
      ship.vy = (ship.y - py) / Math.max(dt, .001);
      ship.tilt += ((Math.max(-.5, Math.min(.5, ship.vy / 900))) - ship.tilt) * (1 - Math.exp(-14 * dt));

      if (phase > 0) phase -= dt;
      if (cooldown > 0) cooldown -= dt;
      el.phaseFill.style.transform = 'scaleX(' + (1 - Math.max(0, cooldown) / PHASE_CD).toFixed(3) + ')';

      spawnT -= dt;
      if (spawnT <= 0) { spawnOrb(); spawnT = Math.max(.32, .95 - dist / 9000) * (.7 + Math.random() * .6); }

      emit(ship.x - 20, ship.y, 0);

      for (let i = orbs.length - 1; i >= 0; i--) {
        const o = orbs[i];
        o.x -= o.vx * dt * (phase > 0 ? .55 : 1);
        o.ph += dt * 2; o.y += Math.sin(o.ph) * o.amp * dt;
        if (o.x < -o.r * 3) { orbs.splice(i, 1); continue; }
        if (phase <= 0) {
          const dx = o.x - ship.x, dy = o.y - ship.y, rr = o.r * .7 + 11;
          if (dx * dx + dy * dy < rr * rr) { crash(); break; }
        }
      }
    } else {
      scroll += 40 * dt;
      if (mode === 'menu') { ship.x = W * .5; ship.y = H * .5; }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life += dt;
      if (p.life >= p.max) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    if (shake > 0) shake = Math.max(0, shake - dt);
  }

  // ---------- render ----------
  function draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake * 26, (Math.random() - .5) * shake * 26);

    if (bgCanvas) {
      const off = -((scroll * .18) % bgW);
      for (let x = off; x < W; x += bgW) ctx.drawImage(bgCanvas, x, 0, bgW, H);
    }
    // stars
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      const x = ((s.x - scroll * s.z * .55) % W + W) % W;
      ctx.globalAlpha = .16 + s.z * .34;
      ctx.fillRect(x, s.y, s.z * 1.6, s.z * 1.6);
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    // sparks / trail
    for (const p of sparks) {
      const t = p.life / p.max, sz = 26 * p.s * (1 - t * .6);
      ctx.globalAlpha = (1 - t) * .9;
      ctx.drawImage(sprSpark, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    // orbs
    ctx.globalAlpha = 1;
    for (const o of orbs) { const d = o.r * 3.4; ctx.drawImage(sprOrb, o.x - d / 2, o.y - d / 2, d, d); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (mode !== 'over') drawShip();
    ctx.restore();

    ctx.drawImage(vig, 0, 0, W, H);

    // cursor
    if (mode !== 'over') {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.25;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 6.283); ctx.stroke();
    }
  }

  function drawShip() {
    const ghost = phase > 0;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    if (mode === 'menu') ctx.translate(0, Math.sin(performance.now() / 900) * 6);
    ctx.rotate(ship.tilt);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = ghost ? .9 : .55;
    ctx.drawImage(sprHalo, -80, -80, 160, 160);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = ghost ? .5 : 1;

    // flame
    const fl = 14 + Math.random() * 7;
    const fg = ctx.createLinearGradient(-14, 0, -14 - fl - 8, 0);
    fg.addColorStop(0, 'rgba(255,200,150,.95)'); fg.addColorStop(1, 'rgba(255,106,43,0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(-13, -5); ctx.quadraticCurveTo(-13 - fl, 0, -13, 5); ctx.fill();

    // fins
    ctx.fillStyle = '#ff6a2b';
    ctx.beginPath(); ctx.moveTo(-4, -8); ctx.lineTo(-17, -19); ctx.lineTo(-15, -4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4, 8); ctx.lineTo(-17, 19); ctx.lineTo(-15, 4); ctx.closePath(); ctx.fill();
    // body
    const bg = ctx.createLinearGradient(0, -10, 0, 10);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#d9d9de');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.moveTo(26, 0); ctx.quadraticCurveTo(10, -11, -14, -9); ctx.lineTo(-14, 9); ctx.quadraticCurveTo(10, 11, 26, 0); ctx.closePath(); ctx.fill();
    // window
    ctx.fillStyle = '#1b0d07';
    ctx.beginPath(); ctx.arc(7, 0, 3.4, 0, 6.283); ctx.fill();
    ctx.restore();
  }

  // ---------- loop with clamped dt; pauses when hidden ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
